name: One-time npm lockfile repair

on:
  push:
    branches: ["codex/production-readiness-2026-10-13"]
    paths:
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/production-readiness-2026-10-13
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconcile package lock without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit corrected lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already consistent"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize npm lockfile"
          git push origin HEAD:codex/production-readiness-2026-10-13
