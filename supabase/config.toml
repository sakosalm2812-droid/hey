[functions.hey]
# The edge handler validates every POST token itself; platform JWT verification
# is disabled so its minimal GET /health endpoint can be reached anonymously.
verify_jwt = false

[functions.hey-studio]
verify_jwt = true

[functions.hey-mandate]
verify_jwt = true

[functions.hey-device-transport]
# Device credentials are verified by the handler and resolved against the
# service-role-only credential store; user credential rotation verifies JWT itself.
verify_jwt = false

# Hosted SMTP must also be configured in the Supabase Dashboard.
[auth.email.smtp]
enabled = false
sender_name = "Hey"

[auth.email.template.confirmation]
subject = "Welcome to Hey"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Hey password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your Hey sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "You are invited to Hey"
content_path = "./supabase/templates/invite.html"

[auth.email.template.email_change]
subject = "Confirm your Hey email change"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Your Hey verification code"
content_path = "./supabase/templates/reauthentication.html"
